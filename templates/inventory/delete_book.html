{% extends "base.html" %}

{% block title %}Delete Book | My Library{% endblock title %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5 text-center">
                    <h1 class="h3 fw-bold mb-3">Delete this book?</h1>

                    <p class="text-secondary mb-2">
                        You are about to delete:
                    </p>

                    <p class="fs-5 fw-semibold mb-1">
                        {{ object.title }}
                    </p>

                    <p class="text-secondary">
                        by {{ object.author }}
                    </p>

                    <div class="alert alert-warning mt-4">
                        This action cannot be undone.
                    </div>

                    <form method="post" class="d-flex justify-content-center gap-2 mt-4">
                        {% csrf_token %}

                        <a href="{% url 'inventory_page' %}"
                            class="btn btn-outline-secondary">
                            Cancel
                        </a>

                        <button type="submit" class="btn btn-danger">
                            Yes, Delete
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock content %}
